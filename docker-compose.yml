services:
  db:
    image: postgres:16-alpine
    container_name: tienda_nest_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tiendavr}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tiendavr}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: tienda_nest_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-tiendavr}
      JWT_SECRET: ${JWT_SECRET:?falta definir JWT_SECRET}
      JWT_EXPIRES_MINUTES: ${JWT_EXPIRES_MINUTES:-60}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_CORREO: ${ADMIN_CORREO:-admin@tienda.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_MONEDA: ${STRIPE_MONEDA:-usd}
      STRIPE_TASA_BOB: ${STRIPE_TASA_BOB:-6.96}
      STRIPE_MINIMO_CENTAVOS: ${STRIPE_MINIMO_CENTAVOS:-50}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      RESERVA_HORAS_VIGENCIA: ${RESERVA_HORAS_VIGENCIA:-24}
    volumes:
      - imagenes:/app/uploads
    ports:
      - "${API_PORT:-3000}:3000"

volumes:
  datos_postgres:
  imagenes:
